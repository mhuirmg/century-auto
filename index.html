function formatPostingDate(d) {
  if (!d) return "";
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const parts = d.split("/");
  if (parts.length === 3) {
    const m = parseInt(parts[0], 10) - 1;
    const y = parts[2];
    return months[m] + " " + y;
  }
  return d;
}
