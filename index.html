const supa = {
  async get() {
    const r = await fetch(`${SUPA_URL}/rest/v1/vehicles?order=stock.asc&limit=500`, { headers: HEADERS });
    if (!r.ok) throw new Error(await r.text());
    return (await r.json()).map(fromDB);
  },
  async insert(v) {
    const r = await fetch(`${SUPA_URL}/rest/v1/vehicles`, { method:"POST", headers: HEADERS, body: JSON.stringify(toDB(v)) });
    if (!r.ok) throw new Error(await r.text());
    return fromDB((await r.json())[0]);
  },
  async update(id, fields) {
    // Convert camelCase fields to snake_case on the fly
    const map = { keyLocation:"key_location", fileLocation:"file_location", makeReady:"make_ready",
      keyLog:"key_log", fileLog:"file_log", detailLog:"detail_log", makeReadyLog:"make_ready_log",
      status:"status", detailed:"detailed", make:"make", model:"model", trim:"trim",
      color:"color", year:"year", odometer:"odometer", type:"type", vin:"vin",
      stock:"stock", addedBy:"added_by", addedAt:"added_at" };
    const body = {};
    for(const [k,v] of Object.entries(fields)) body[map[k]||k] = v;
    const r = await fetch(`${SUPA_URL}/rest/v1/vehicles?id=eq.${id}`, { method:"PATCH", headers: HEADERS, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
  },
  async delete(id) {
    const r = await fetch(`${SUPA_URL}/rest/v1/vehicles?id=eq.${id}`, { method:"DELETE", headers: HEADERS });
    if (!r.ok) throw new Error(await r.text());
  },
  // Supabase Realtime via WebSocket
  subscribe(onUpdate) {
    const ws = new WebSocket(`wss://uovwaiqcuxxibihcbppx.supabase.co/realtime/v1/websocket?apikey=${SUPA_KEY}&vsn=1.0.0`);
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic:"realtime:public:vehicles", event:"phx_join", payload:{}, ref:"1" }));

      const msg = JSON.parse(e.data);
      if(msg.event === "postgres_changes" || (msg.payload && msg.payload.data)) onUpdate();
    };
    ws.onerror = () => {}; // silent — polling fallback handles it
    return ws;
  }
};

function useVehicles() {
  const [vehicles, setVehicles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const wsRef = useRef(null);

  const load = useCallback(async () => {
    try {
      const data = await supa.get();
      setVehicles(data);
      setError(null);
    } catch(e) {
      setError("Could not connect to database. Check your internet connection.");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    load();
    // Realtime subscription
    try {
      wsRef.current = supa.subscribe(() => load());
    } catch(e) {}
    // Polling fallback every 15s
    const poll = setInterval(() => load(), 15000);
    return () => {
      clearInterval(poll);
      if(wsRef.current) try { wsRef.current.close(); } catch(e) {}
    };
  }, [load]);

  return [vehicles, setVehicles, loading, error, load];
}

        {/* Search row — always visible */}
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:isMobile&&!showFilters?0:8}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Search stock, VIN, make, model..." style={{flex:1,background:"#060610",border:"1px solid #1a1a2a",borderRadius:6,padding:"9px 12px",color:"#e0e0ff",fontFamily:"inherit"}}/>
          {isMobile&&<button onClick={()=>setShowFilters(f=>!f)} style={{background:showFilters?"#1e3a6e":"#0e0e1e",color:showFilters?"#60a0ff":"#6666aa",border:"1px solid #1a1a2e",borderRadius:6,padding:"9px 12px",fontFamily:"inherit",fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",fontSize:12}}>
            {showFilters?"▲ Filters":"▼ Filters"}{(fStatus!=="all"||fDetail!=="all"||fMR!=="all"||fNoKey||fNoFile)&&<span style={{background:"#E53935",color:"#fff",borderRadius:10,padding:"0 5px",fontSize:9,marginLeft:4}}> </span>}
          </button>}
          {!isMobile&&<div style={{display:"flex",gap:3}}>
            {["table","cards"].map(v=><button key={v} onClick={()=>setView(v)} style={{background:view===v?"#1e1e3a":"transparent",color:view===v?"#e0e0ff":"#5555aa",border:"1px solid #1a1a2e",borderRadius:5,padding:"7px 10px",cursor:"pointer",fontSize:14}}>
              {v==="table"?"☰":"⊞"}
            </button>)}
          </div>}
        </div>
        {/* Expanded filters */}
        {(!isMobile||showFilters)&&<div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:8}}>
            <div style={{display:"flex",gap:3,background:"#060610",borderRadius:8,padding:3}}>
              {[["all","All"],["used","Used"],["new","New"]].map(([v,l])=>(
                <button key={v} onClick={()=>setTab(v)} style={{background:tab===v?"#1e3a6e":"transparent",color:tab===v?"#60a0ff":"#5555aa",border:"none",borderRadius:6,padding:isMobile?"6px 14px":"4px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
              ))}
            </div>
            {!isMobile&&<div style={{width:1,height:22,background:"#1a1a2e"}}/>}
            {STATUS_OPTIONS.map(s=>pill(fStatus===s,()=>setFStatus(fStatus===s?"all":s), s==="in shop"?"In Shop":s==="to be delivered"?"To Deliver":s==="sold & delivered"?"Sold":s.charAt(0).toUpperCase()+s.slice(1)))}
          </div>
          <div style={{display:"flex",gap:isMobile?8:8,flexWrap:"wrap",alignItems:"center"}}>
            {pill(fDetail==="no",()=>setFDetail(fDetail==="no"?"all":"no"),"Needs Detail",stats.noDetail)}
            {pill(fDetail==="yes",()=>setFDetail(fDetail==="yes"?"all":"yes"),"Detailed")}
            <select value={fMR} onChange={e=>setFMR(e.target.value)} style={{background:"#060610",border:"1px solid #1a1a2a",borderRadius:6,padding:"6px 10px",color:"#e0e0ff",fontFamily:"inherit"}}>
              <option value="all">All Make Ready</option>
              {allMRopts.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
            <label style={{color:fNoKey?"#ff6655":"#6666aa",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontWeight:700,userSelect:"none",padding:"6px 0"}}>
              <input type="checkbox" checked={fNoKey} onChange={e=>setFNoKey(e.target.checked)} style={{accentColor:"#FF5252",width:16,height:16}}/>🔑 No Key
            </label>
            <label style={{color:fNoFile?"#ff6655":"#6666aa",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontWeight:700,userSelect:"none",padding:"6px 0"}}>
              <input type="checkbox" checked={fNoFile} onChange={e=>setFNoFile(e.target.checked)} style={{accentColor:"#FF5252",width:16,height:16}}/>📁 No File
            </label>
          </div>
        </div>}
      </div>

      <div style={{fontSize:10,color:"#333388",marginBottom:8,fontWeight:700}}>SHOWING {filtered.length} OF {vehicles.length} VEHICLES</div>

      {/* TABLE */}
      {view==="table"&&!isMobile&&<div style={{background:"#0a0a16",border:"1px solid #1a1a2e",borderRadius:10,overflow:"hidden",animation:"fadeIn 0.15s ease"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontFamily:"'Barlow',sans-serif"}}>
            <thead style={{background:"#060610"}}>
              <tr>
                <TH col="stock" label="STOCK #"/>
                <th style={{padding:"8px 6px",fontSize:9,color:"#3333aa",fontWeight:800,letterSpacing:1,borderBottom:"1px solid #111128"}}>T</th>
                <TH col="year" label="YR"/>
                <TH col="make" label="MAKE"/>
                <TH col="model" label="MODEL"/>
                <TH col="trim" label="TRIM"/>
                <TH col="color" label="COLOR"/>
                <TH col="keyLocation" label="🔑 KEY LOCATION"/>
                <TH col="fileLocation" label="📁 FILE LOCATION"/>
                <th style={{padding:"8px 6px",fontSize:9,color:"#3333aa",fontWeight:800,letterSpacing:1,borderBottom:"1px solid #111128",whiteSpace:"nowrap"}}>🚿 DETAIL</th>
                <th style={{padding:"8px 6px",fontSize:9,color:"#3333aa",fontWeight:800,letterSpacing:1,borderBottom:"1px solid #111128",whiteSpace:"nowrap"}}>✅ MAKE READY</th>
                <th style={{padding:"8px 6px",fontSize:9,color:"#3333aa",fontWeight:800,letterSpacing:1,borderBottom:"1px solid #111128"}}>STATUS</th>
                <th style={{padding:"8px 6px",fontSize:9,color:"#3333aa",fontWeight:800,letterSpacing:1,borderBottom:"1px solid #111128"}}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={13} style={{textAlign:"center",padding:40,color:"#333388",fontSize:13}}>No vehicles found</td></tr>}
              {filtered.map(v=><tr key={v.id} style={{borderBottom:"1px solid #0e0e1c",cursor:"pointer"}}>
                <td onClick={()=>setDetailV(v)} style={{padding:"7px 8px",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#6677ee",fontWeight:500,whiteSpace:"nowrap"}}>{v.stock}</td>
                <td style={{padding:"7px 5px"}}><Bdg label={v.type==="new"?"N":"U"} bg={v.type==="new"?"#1a2060":"#0a3020"} small/></td>
                <td onClick={()=>setDetailV(v)} style={{padding:"7px 5px",fontSize:12,color:"#7777aa"}}>{v.year}</td>
                <td onClick={()=>setDetailV(v)} style={{padding:"7px 6px",fontSize:12,fontWeight:600,color:"#c0c0e0",whiteSpace:"nowrap"}}>{v.make}</td>
                <td onClick={()=>setDetailV(v)} style={{padding:"7px 6px",fontSize:12,color:"#e0e0ff",whiteSpace:"nowrap"}}>{v.model}</td>
                <td onClick={()=>setDetailV(v)} style={{padding:"7px 6px",fontSize:11,color:"#8888bb",whiteSpace:"nowrap",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis"}}>{v.trim}</td>
                <td onClick={()=>setDetailV(v)} style={{padding:"7px 6px",fontSize:11,color:"#9090cc",whiteSpace:"nowrap"}}>{v.color||"—"}</td>
                <td style={{padding:"4px 6px"}}>
                  <select value={v.keyLocation} onChange={e=>qs(v.id,"keyLocation",e.target.value)} style={selStyle(!!v.keyLocation)}>
                    {KEY_BOXES.map(o=><option key={o} value={o}>{o||"— Not Set —"}</option>)}
                  </select>
                  {v.keyLog&&<div style={{fontSize:9,color:"#3344aa",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:150}} title={v.keyLog}>↳ {v.keyLog}</div>}
                </td>
                <td style={{padding:"4px 6px"}}>
                  <select value={v.fileLocation} onChange={e=>qs(v.id,"fileLocation",e.target.value)} style={selStyle(!!v.fileLocation)}>
                    {FILE_LOCS.map(o=><option key={o} value={o}>{o||"— Not Set —"}</option>)}
                  </select>
                  {v.fileLog&&<div style={{fontSize:9,color:"#3344aa",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:150}} title={v.fileLog}>↳ {v.fileLog}</div>}
                </td>
                <td style={{padding:"4px 6px"}}>
                  <button onClick={()=>togDetail(v.id)} style={{background:"transparent",border:"none",cursor:"pointer",padding:0}}>
                    <Bdg label={v.detailed?"✓ Done":"✗ Needed"} bg={v.detailed?"#0a2a0a":"#2a0a08"} small/>
                  </button>
                  {v.detailLog&&<div style={{fontSize:9,color:"#3344aa",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:130}} title={v.detailLog}>↳ {v.detailLog}</div>}
                </td>
                <td style={{padding:"4px 6px"}}>
                  <select value={v.makeReady} onChange={e=>qs(v.id,"makeReady",e.target.value)} style={{background:"#0a0a18",border:"1px solid #1e1e34",borderRadius:4,padding:"3px 5px",color:"#e0e0ff",fontSize:11,fontFamily:"inherit",cursor:"pointer"}}>
                    {(v.type==="new"?MR_NEW:MR_USED).map(o=><option key={o} value={o}>{o||"— Not Set —"}</option>)}
                  </select>
                  {v.makeReadyLog&&<div style={{fontSize:9,color:"#3344aa",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:130}} title={v.makeReadyLog}>↳ {v.makeReadyLog}</div>}
                </td>
                <td style={{padding:"5px 6px"}}>
                  <select value={v.status} onChange={e=>qs(v.id,"status",e.target.value)} style={{background:"#0a0a18",border:"1px solid #1e1e34",borderRadius:4,padding:"3px 5px",color:"#e0e0ff",fontSize:11,fontFamily:"inherit",cursor:"pointer"}}>
                    {STATUS_OPTIONS.map(o=><option key={o} value={o}>{o.charAt(0).toUpperCase()+o.slice(1)}</option>)}
                  </select>
                </td>
                <td style={{padding:"5px 6px"}}>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={()=>{setEditV(v);setShowAdd(true);}} style={{background:"#0e1a3a",color:"#4488ff",border:"none",borderRadius:4,padding:"3px 7px",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>EDIT</button>
                    <button onClick={()=>del(v.id)} style={{background:"#2a0808",color:"#ff5555",border:"none",borderRadius:4,padding:"3px 7px",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>DEL</button>
                  </div>
                </td>
              </tr>)}
            </tbody>
          </table>
        </div>
      </div>}

      {/* CARDS / MOBILE LIST */}
      {(view==="cards"||isMobile)&&<div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"repeat(auto-fill,minmax(260px,1fr))",gap:isMobile?8:10,animation:"fadeIn 0.15s ease"}}>
        {filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:40,color:"#333388"}}>No vehicles found</div>}
        {filtered.map(v=>(
          <div key={v.id} style={{background:"#0a0a16",border:"1px solid #1a1a2e",borderRadius:10,overflow:"hidden",position:"relative"}}>
            <div style={{height:3,background:STATUS_COLORS[v.status]||"#333"}}/>
            {/* Tappable header */}
            <div onClick={()=>setDetailV(v)} style={{padding:"10px 13px 8px",cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{minWidth:0}}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#5566dd"}}>#{v.stock}</div>
                  <div style={{fontSize:isMobile?15:14,fontWeight:700,color:"#fff",lineHeight:1.3,marginTop:1}}>{v.year} {v.make} {v.model}</div>
                  <div style={{fontSize:11,color:"#8888bb",marginTop:1}}>{v.trim}{v.color&&` · ${v.color}`}</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0,marginLeft:8}}>
                  <Bdg label={v.type==="new"?"NEW":"USED"} bg={v.type==="new"?"#1a2060":"#0a3020"} small/>
                  <Bdg label={v.status==="in shop"?"In Shop":v.status==="to be delivered"?"To Deliver":v.status==="sold & delivered"?"Sold✓":v.status.charAt(0).toUpperCase()+v.status.slice(1)} bg={STATUS_COLORS[v.status]||"#333"} small/>
                </div>
              </div>
              {/* Key + File */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginTop:8}}>
                {[["🔑",v.keyLocation,v.keyLog],["📁",v.fileLocation,v.fileLog]].map(([icon,val,log])=>(
                  <div key={icon} style={{background:"#060610",borderRadius:5,padding:"5px 8px"}}>
                    <div style={{fontSize:isMobile?11:10,color:val?"#7799ff":"#ff6655",fontWeight:600}}>{icon} {val||"NOT SET"}</div>
                    {log&&<div style={{fontSize:9,color:"#3344aa",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>↳ {log}</div>}
                  </div>
                ))}
              </div>
            </div>
            {/* Quick-action row — big touch targets on mobile */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",borderTop:"1px solid #111128"}}>
              <button onClick={()=>togDetail(v.id)} style={{background:"transparent",border:"none",borderRight:"1px solid #111128",padding:isMobile?"11px 4px":"7px 4px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <span style={{fontSize:isMobile?14:12}}>{v.detailed?"✅":"🔲"}</span>
                <span style={{fontSize:8,color:v.detailed?"#00CC55":"#FF5555",fontWeight:700}}>{v.detailed?"DONE":"DETAIL"}</span>
                {v.detailLog&&<span style={{fontSize:7,color:"#3344aa",maxWidth:70,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>↳{v.detailLog.split("·")[0]}</span>}
              </button>
              <div style={{borderRight:"1px solid #111128",padding:isMobile?"6px 4px":"4px 4px",display:"flex",flexDirection:"column",gap:2,alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:8,color:"#3333aa",fontWeight:800}}>READY</span>
                <select value={v.makeReady} onChange={e=>qs(v.id,"makeReady",e.target.value)} style={{background:"transparent",border:"none",color:"#e0e0ff",fontSize:9,fontFamily:"inherit",cursor:"pointer",maxWidth:72,textAlign:"center"}}>
                  {(v.type==="new"?MR_NEW:MR_USED).map(o=><option key={o} value={o}>{o||"—"}</option>)}
                </select>
              </div>
              <div style={{borderRight:"1px solid #111128",padding:isMobile?"6px 4px":"4px 4px",display:"flex",flexDirection:"column",gap:2,alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:8,color:"#3333aa",fontWeight:800}}>STATUS</span>
                <select value={v.status} onChange={e=>qs(v.id,"status",e.target.value)} style={{background:"transparent",border:"none",color:"#e0e0ff",fontSize:9,fontFamily:"inherit",cursor:"pointer",maxWidth:72,textAlign:"center"}}>
                  {STATUS_OPTIONS.map(o=><option key={o} value={o}>{o==="in shop"?"In Shop":o==="to be delivered"?"Deliver":o==="sold & delivered"?"Sold✓":o.charAt(0).toUpperCase()+o.slice(1)}</option>)}
                </select>
              </div>
              <button onClick={()=>setDetailV(v)} style={{background:"transparent",border:"none",padding:isMobile?"11px 4px":"7px 4px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <span style={{fontSize:isMobile?14:12}}>📋</span>
                <span style={{fontSize:8,color:"#4488ff",fontWeight:700}}>DETAIL</span>
              </button>
            </div>
          </div>
        ))}
      </div>}
    </div>


        <Modal open={showAdd} onClose={()=>{setShowAdd(false);setEditV(null);}}>
      <VehicleForm vehicle={editV} onSave={save} onClose={()=>{setShowAdd(false);setEditV(null);}}/>
    </Modal>

    <Modal open={!!detailV&&!showAdd} onClose={()=>setDetailV(null)}>
      {detailV&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#5566dd",marginBottom:2}}>STOCK #{detailV.stock} · {detailV.type==="new"?"NEW":"USED"}</div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:"#fff",letterSpacing:1}}>{detailV.year} {detailV.make} {detailV.model}</div>
            <div style={{fontSize:11,color:"#8888bb"}}>{detailV.trim}{detailV.color&&` · ${detailV.color}`}</div>
          </div>
          <Bdg label={detailV.status==="in shop"?"In Shop":detailV.status.charAt(0).toUpperCase()+detailV.status.slice(1)} bg={STATUS_COLORS[detailV.status]||"#333"}/>
        </div>
        {[
          ["VIN",detailV.vin||"—","mono"],
          ["Odometer",detailV.odometer?`${Number(detailV.odometer).toLocaleString()} km`:"—"],
        ].map(([k,val,mono])=><div key={k} style={{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #141424",padding:"7px 0",alignItems:"center"}}>
          <span style={{color:"#444488",fontSize:11,fontWeight:700,letterSpacing:0.5}}>{k}</span>
          <span style={{color:"#e0e0ff",fontSize:12,fontFamily:mono?"'JetBrains Mono',monospace":"inherit"}}>{val}</span>
        </div>)}
        {/* Tracked fields with log */}
        {[
          {label:"🔑 Key Location", val:detailV.keyLocation||"NOT SET", log:detailV.keyLog, notSet:!detailV.keyLocation},
          {label:"📁 File Location", val:detailV.fileLocation||"NOT SET", log:detailV.fileLog, notSet:!detailV.fileLocation},
          {label:"🚿 Detail Status", val:detailV.detailed?"✓ Detailed":"✗ Not Detailed", log:detailV.detailLog, notSet:false},
          {label:"✅ Make Ready", val:detailV.makeReady||"Not Set", log:detailV.makeReadyLog, notSet:!detailV.makeReady},
        ].map(({label,val,log,notSet})=><div key={label} style={{borderBottom:"1px solid #141424",padding:"7px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:"#444488",fontSize:11,fontWeight:700,letterSpacing:0.5}}>{label}</span>
            <span style={{color:notSet?"#ff6655":"#e0e0ff",fontSize:12}}>{val}</span>
          </div>
          {log&&<div style={{fontSize:10,color:"#4455aa",marginTop:2,textAlign:"right"}}>↳ Last changed by {log}</div>}
        </div>)}
        {[
          ["Entered By",detailV.addedBy||"—"],
          ["Date Added",detailV.addedAt||"—"],
        ].map(([k,val])=><div key={k} style={{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #141424",padding:"7px 0",alignItems:"center"}}>
          <span style={{color:"#444488",fontSize:11,fontWeight:700,letterSpacing:0.5}}>{k}</span>
          <span style={{color:"#e0e0ff",fontSize:12}}>{val}</span>
        </div>)}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:14}}>
          <button onClick={()=>togDetail(detailV.id)} style={{background:detailV.detailed?"#0a2a0a":"#2a0a08",color:detailV.detailed?"#00CC55":"#FF5555",border:`1px solid ${detailV.detailed?"#00CC55":"#FF5555"}`,borderRadius:6,padding:"8px 4px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {detailV.detailed?"✓ DETAILED":"MARK DETAILED"}
          </button>
          <button onClick={()=>{setEditV(detailV);setShowAdd(true);}} style={{background:"#0a1a3a",color:"#4488ff",border:"1px solid #4488ff",borderRadius:6,padding:"8px 4px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>EDIT</button>
          <button onClick={()=>del(detailV.id)} style={{background:"#2a0808",color:"#FF5555",border:"1px solid #FF5555",borderRadius:6,padding:"8px 4px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>DELETE</button>
        </div>
        <button onClick={()=>setDetailV(null)} style={{width:"100%",marginTop:8,background:"#1a1a2e",color:"#8888bb",border:"none",borderRadius:6,padding:"8px 0",fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer"}}>CLOSE</button>
      </div>}
    </Modal>
  </div>;
}

  const domRoot = ReactDOM.createRoot(document.getElementById('root'));
  domRoot.render(React.createElement(App));
  </script>
</body>
</html>
